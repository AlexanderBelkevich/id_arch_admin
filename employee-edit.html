<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/normalize.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"
    />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>ID Architects</title>
  </head>
  <body>
    <header class="header">
      <div class="content header-content">
        <a href="/">
          <img src="./assets/svg/logo.svg" alt="logo" />
        </a>
        <nav class="header-menu">
          <a href="#" class="header-menu__link active">Список проектов</a>
          <a href="#" class="header-menu__link">Список администраторов</a>
        </nav>
      </div>
    </header>
    <div class="content">
      <form class="block">
        <span class="block-title page-title">Добавление администратора</span>
        <div class="employee-form">
          <div class="upload-container" id="uploadContainer">
            <input type="file" id="fileInput" class="hidden" accept="image/*">
            <img id="previewImage" class="upload-container-edit-img" src="./assets/img/image.png" alt="Preview">
            <span id="removeBtn" class="upload-container-remove">
              <img src="./assets/svg/upload-remove.svg"/>
            </span>
          </div>
          <div class="user-inputs">
            <input
                    type="text"
                    class="input"
                    name="user-name"
                    id="user-name"
                    required
                    placeholder="Имя"
                    value="Наталья"
            />
            <input
                    type="text"
                    class="input"
                    name="user-password"
                    id="user-password"
                    required
                    placeholder="Должность"
                    value="Руководитель"
            />
          </div>
        </div>
        <span class="employee-info-photo">Размер для фото сотрудника должен быть 140х140px.</span>
        <div class="user-inputs-buttons">
          <button class="button">Добавить</button>
          <button class="button white">Отмена</button>
        </div>
      </form>
    </div>
    <script>
      const uploadContainer = document.getElementById('uploadContainer');
      const fileInput = document.getElementById('fileInput');
      const previewImage = document.getElementById('previewImage');
      const removeBtn = document.getElementById('removeBtn');

      uploadContainer.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            previewImage.src = e.target.result;
            previewImage.style.display = 'block';
            removeBtn.style.display = 'block';
          };
          reader.readAsDataURL(file);
        }
      });

      removeBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        previewImage.src = '';
        previewImage.style.display = 'none';
        removeBtn.style.display = 'none';
        fileInput.value = '';
      });
    </script>
    <script src="./assets/scripts/index.js"></script>
  </body>
</html>
